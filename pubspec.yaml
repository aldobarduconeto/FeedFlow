name: feedflow
description: “Seu mundo de informação, em fluxo.”
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  xml: ^7.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#080B14"
  adaptive_icon_foreground: assets/icon.png
  adaptive_icon_foreground_inset: 8
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#080B14"
    theme_color: "#080B14"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon.png
