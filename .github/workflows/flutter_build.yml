name: Flutter Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*' # Executa ao fazer push de tags no formato v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Permite disparar o build manualmente na aba Actions do GitHub

jobs:
  # ------------------------------------------------------
  # 3. Builds para iOS e macOS (Runner macOS)
  # ------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ios, macos]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version: 3.47.8

      - name: Instalar dependências
        run: flutter pub get

      - name: Build para iOS (Sem assinatura de código)
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && zip -r ../../../ios-build.zip . && cd ../../..

      - name: Build para macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release && zip -r ../../../../../macos-build.zip . && cd ../../../../..

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            ios-build.zip
            macos-build.zip

  # ------------------------------------------------------
  # 4. Publicação unificada no GitHub Releases
  # ------------------------------------------------------
  publish-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organizar arquivos para a Release
        run: |
          mkdir -p release_assets
          cp artifacts/build-ios/ios-build.zip release_assets/ios-build.zip || true
          cp artifacts/build-macos/macos-build.zip release_assets/macos-build.zip || true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
